<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1520"/>
      <stop offset="100%" stop-color="#1A2535"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3545"/>
      <stop offset="100%" stop-color="#1A2535"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0A0E19"/>
    </linearGradient>
    <radialGradient id="sirenRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05A1A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E05A1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sirenBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B9BD5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5B9BD5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="400" height="220" fill="url(#sky)"/>

  <!-- Road -->
  <rect x="0" y="170" width="400" height="50" fill="url(#road)"/>
  <line x1="0" y1="170" x2="400" y2="170" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Road markings -->
  <g stroke="#2B3340" stroke-width="2" stroke-dasharray="30,20" opacity="0.5">
    <line x1="0" y1="195" x2="400" y2="195"/>
  </g>

  <!-- Siren light glow on road/environment -->
  <ellipse cx="155" cy="130" rx="80" ry="40" fill="url(#sirenRed)" opacity="0.5"/>
  <ellipse cx="255" cy="130" rx="60" ry="35" fill="url(#sirenBlue)" opacity="0.35"/>

  <!-- Speed blur lines -->
  <g stroke="#E05A1A" stroke-width="1" opacity="0.18" stroke-linecap="round">
    <line x1="0" y1="145" x2="40" y2="145"/>
    <line x1="0" y1="152" x2="30" y2="152"/>
    <line x1="0" y1="159" x2="50" y2="159"/>
    <line x1="0" y1="133" x2="25" y2="133"/>
  </g>

  <!-- ── CAR BODY ── -->
  <!-- Main body -->
  <path d="M55,168 L55,128 L85,115 L330,115 L360,128 L360,168 Z" fill="url(#carBody)" stroke="#3A4A5C" stroke-width="1.5"/>

  <!-- Front bumper detail -->
  <path d="M340,128 L365,135 L365,162 L340,165" fill="#1A2535" stroke="#3A4A5C" stroke-width="1"/>
  <!-- Headlight glow front -->
  <ellipse cx="352" cy="142" rx="18" ry="10" fill="#F07820" opacity="0.25"/>
  <rect x="342" y="136" width="22" height="12" rx="2" fill="#F07820" opacity="0.7"/>
  <rect x="344" y="138" width="18" height="8" rx="1" fill="white" opacity="0.5"/>

  <!-- Rear lights -->
  <rect x="57" y="133" width="14" height="20" rx="2" fill="#C0392B" opacity="0.8"/>
  <rect x="59" y="135" width="10" height="16" rx="1" fill="#E05A1A" opacity="0.9"/>

  <!-- Cabin / windshield area -->
  <path d="M105,115 L125,88 L290,88 L310,115" fill="#1E2C3C" stroke="#3A4A5C" stroke-width="1"/>
  <!-- A-pillar lines -->
  <line x1="125" y1="88" x2="105" y2="115" stroke="#3A4A5C" stroke-width="1.5"/>
  <line x1="290" y1="88" x2="310" y2="115" stroke="#3A4A5C" stroke-width="1.5"/>
  <!-- B-pillar -->
  <line x1="200" y1="88" x2="200" y2="115" stroke="#3A4A5C" stroke-width="2"/>

  <!-- Windshield reflection -->
  <path d="M215,90 L285,90 L305,112 L210,112 Z" fill="white" opacity="0.04"/>
  <path d="M135,92 L155,92 L148,112 L130,112 Z" fill="white" opacity="0.04"/>

  <!-- Door seam line -->
  <line x1="200" y1="115" x2="200" y2="167" stroke="#2B3A4A" stroke-width="1.5"/>
  <!-- Door handles -->
  <rect x="155" y="138" width="22" height="5" rx="2.5" fill="#4A5A6C"/>
  <rect x="218" y="138" width="22" height="5" rx="2.5" fill="#4A5A6C"/>

  <!-- ARMED RESPONSE decal on door -->
  <rect x="70" y="130" width="105" height="16" rx="1" fill="#E05A1A" opacity="0.9"/>
  <text x="122" y="141" font-family="monospace" font-size="8" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="0.5">ARMED RESPONSE</text>

  <!-- Side window tint detail -->
  <rect x="220" y="127" width="80" height="16" rx="1" fill="#0A0E19" opacity="0.5"/>

  <!-- ── SIREN LIGHT BAR ── -->
  <rect x="125" y="76" width="150" height="16" rx="3" fill="#111820" stroke="#3A4A5C" stroke-width="1.5"/>
  <!-- Siren segments -->
  <rect x="129" y="79" width="32" height="10" rx="1.5" fill="#E05A1A" filter="url(#glow)"/>
  <rect x="165" y="79" width="32" height="10" rx="1.5" fill="#5B9BD5" opacity="0.9"/>
  <rect x="201" y="79" width="32" height="10" rx="1.5" fill="#E05A1A" filter="url(#glow)"/>
  <rect x="237" y="79" width="32" height="10" rx="1.5" fill="#5B9BD5" opacity="0.9"/>
  <!-- Light bar dividers -->
  <line x1="161" y1="79" x2="161" y2="89" stroke="#111820" stroke-width="1.5"/>
  <line x1="197" y1="79" x2="197" y2="89" stroke="#111820" stroke-width="1.5"/>
  <line x1="233" y1="79" x2="233" y2="89" stroke="#111820" stroke-width="1.5"/>

  <!-- ── WHEELS ── -->
  <!-- Rear wheel -->
  <circle cx="118" cy="170" r="24" fill="#0D1520" stroke="#3A4A5C" stroke-width="2"/>
  <circle cx="118" cy="170" r="16" fill="#141B26" stroke="#4A5A6C" stroke-width="1.5"/>
  <circle cx="118" cy="170" r="8" fill="#0D1520" stroke="#E05A1A" stroke-width="1"/>
  <!-- Rim spokes -->
  <g stroke="#4A5A6C" stroke-width="1.5">
    <line x1="118" y1="154" x2="118" y2="162"/><line x1="118" y1="178" x2="118" y2="186"/>
    <line x1="102" y1="170" x2="110" y2="170"/><line x1="126" y1="170" x2="134" y2="170"/>
    <line x1="106.7" y1="158.7" x2="112.3" y2="164.3"/><line x1="123.7" y1="175.7" x2="129.3" y2="181.3"/>
    <line x1="129.3" y1="158.7" x2="123.7" y2="164.3"/><line x1="112.3" y1="175.7" x2="106.7" y2="181.3"/>
  </g>
  <!-- Front wheel -->
  <circle cx="308" cy="170" r="24" fill="#0D1520" stroke="#3A4A5C" stroke-width="2"/>
  <circle cx="308" cy="170" r="16" fill="#141B26" stroke="#4A5A6C" stroke-width="1.5"/>
  <circle cx="308" cy="170" r="8" fill="#0D1520" stroke="#E05A1A" stroke-width="1"/>
  <g stroke="#4A5A6C" stroke-width="1.5">
    <line x1="308" y1="154" x2="308" y2="162"/><line x1="308" y1="178" x2="308" y2="186"/>
    <line x1="292" y1="170" x2="300" y2="170"/><line x1="316" y1="170" x2="324" y2="170"/>
    <line x1="296.7" y1="158.7" x2="302.3" y2="164.3"/><line x1="313.7" y1="175.7" x2="319.3" y2="181.3"/>
    <line x1="319.3" y1="158.7" x2="313.7" y2="164.3"/><line x1="302.3" y1="175.7" x2="296.7" y2="181.3"/>
  </g>

  <!-- Wheel arch shadow -->
  <path d="M92,155 Q118,148 144,155" fill="none" stroke="#0A0E19" stroke-width="4" opacity="0.6"/>
  <path d="M282,155 Q308,148 334,155" fill="none" stroke="#0A0E19" stroke-width="4" opacity="0.6"/>

  <!-- Exhaust glow -->
  <ellipse cx="62" cy="165" rx="8" ry="4" fill="#4A5A6C" opacity="0.4"/>
</svg>
