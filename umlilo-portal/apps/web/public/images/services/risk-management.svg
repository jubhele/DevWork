<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030"/>
      <stop offset="100%" stop-color="#0A0E19"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2530"/>
      <stop offset="100%" stop-color="#141B26"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#E05A1A" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="55" x2="400" y2="55"/><line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="165" x2="400" y2="165"/>
    <line x1="100" y1="0" x2="100" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/><line x1="300" y1="0" x2="300" y2="220"/>
  </g>
  <!-- Risk matrix grid (left side) -->
  <g stroke="#2B3340" stroke-width="1" opacity="0.8">
    <!-- Columns -->
    <line x1="55" y1="55" x2="55" y2="185"/>
    <line x1="90" y1="55" x2="90" y2="185"/>
    <line x1="125" y1="55" x2="125" y2="185"/>
    <line x1="160" y1="55" x2="160" y2="185"/>
    <!-- Rows -->
    <line x1="20" y1="90" x2="160" y2="90"/>
    <line x1="20" y1="125" x2="160" y2="125"/>
    <line x1="20" y1="160" x2="160" y2="160"/>
    <!-- Border -->
    <rect x="20" y="55" width="140" height="130" fill="none" stroke="#E05A1A" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Risk matrix cells (color coded) -->
  <!-- High risk (red) -->
  <rect x="125" y="55" width="35" height="35" rx="1" fill="#C0392B" opacity="0.5"/>
  <rect x="125" y="90" width="35" height="35" rx="1" fill="#C0392B" opacity="0.3"/>
  <rect x="90" y="55" width="35" height="35" rx="1" fill="#F07820" opacity="0.4"/>
  <!-- Medium (amber) -->
  <rect x="90" y="90" width="35" height="35" rx="1" fill="#F07820" opacity="0.3"/>
  <rect x="55" y="55" width="35" height="35" rx="1" fill="#F07820" opacity="0.25"/>
  <rect x="125" y="125" width="35" height="35" rx="1" fill="#F07820" opacity="0.25"/>
  <!-- Low (green) -->
  <rect x="20" y="55" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.5"/>
  <rect x="20" y="90" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.35"/>
  <rect x="55" y="90" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.25"/>
  <rect x="20" y="125" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.4"/>
  <rect x="55" y="125" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.3"/>
  <rect x="20" y="160" width="35" height="25" rx="1" fill="#1E6B40" opacity="0.5"/>
  <rect x="55" y="160" width="35" height="25" rx="1" fill="#1E6B40" opacity="0.3"/>
  <rect x="90" y="125" width="35" height="35" rx="1" fill="#1E6B40" opacity="0.2"/>
  <rect x="90" y="160" width="35" height="25" rx="1" fill="#F07820" opacity="0.2"/>
  <rect x="125" y="160" width="35" height="25" rx="1" fill="#C0392B" opacity="0.2"/>
  <!-- Axis labels -->
  <text x="90" y="198" font-family="monospace" font-size="8" fill="#7A8699" text-anchor="middle" letter-spacing="1">LIKELIHOOD →</text>
  <text x="10" y="125" font-family="monospace" font-size="8" fill="#7A8699" text-anchor="middle" letter-spacing="1" transform="rotate(-90,10,125)">IMPACT →</text>
  <!-- Plot point (current risk) -->
  <circle cx="107" cy="72" r="6" fill="#E05A1A"/>
  <circle cx="107" cy="72" r="10" fill="none" stroke="#E05A1A" stroke-width="1.5" opacity="0.4"/>
  <!-- Shield (right side) -->
  <path d="M248,40 L352,40 L352,130 L300,165 L248,130 Z" fill="url(#shieldFill)" stroke="#E05A1A" stroke-width="2"/>
  <path d="M258,50 L342,50 L342,125 L300,152 L258,125 Z" fill="none" stroke="#E05A1A" stroke-width="1" opacity="0.4"/>
  <!-- Shield check mark -->
  <polyline points="274,95 292,115 326,72" fill="none" stroke="#E05A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shield label -->
  <text x="300" y="140" font-family="monospace" font-size="8" fill="#E05A1A" text-anchor="middle" letter-spacing="1">SECURE</text>
  <!-- Trend arrow -->
  <g stroke="#4ade80" stroke-width="2" opacity="0.7">
    <polyline points="175,175 195,155 215,165 240,140"/>
    <polygon points="240,140 233,148 247,148" fill="#4ade80"/>
  </g>
  <text x="207" y="190" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">RISK REDUCING</text>
</svg>
