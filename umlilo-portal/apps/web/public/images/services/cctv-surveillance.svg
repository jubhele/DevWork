<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1520"/>
      <stop offset="100%" stop-color="#1A2535"/>
    </linearGradient>
    <radialGradient id="lensInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A3A5C"/>
      <stop offset="60%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#050D14"/>
    </radialGradient>
    <radialGradient id="scanGlow" cx="30%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#E05A1A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E05A1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="220" fill="url(#bg)"/>

  <!-- Ceiling/wall surface -->
  <rect x="0" y="0" width="400" height="38" fill="#141B26"/>
  <line x1="0" y1="38" x2="400" y2="38" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Ceiling tile lines -->
  <g stroke="#1E2530" stroke-width="0.8" opacity="0.6">
    <line x1="0" y1="12" x2="400" y2="12"/>
    <line x1="80" y1="0" x2="80" y2="38"/><line x1="160" y1="0" x2="160" y2="38"/>
    <line x1="240" y1="0" x2="240" y2="38"/><line x1="320" y1="0" x2="320" y2="38"/>
  </g>

  <!-- Scan cone -->
  <polygon points="170,60 380,80 380,200 170,60" fill="url(#scanGlow)"/>
  <!-- Scan cone edge lines -->
  <line x1="170" y1="60" x2="380" y2="80" stroke="#E05A1A" stroke-width="0.8" opacity="0.3"/>
  <line x1="170" y1="60" x2="380" y2="200" stroke="#E05A1A" stroke-width="0.8" opacity="0.3"/>
  <!-- Scan arc rings at distance -->
  <g fill="none" stroke="#E05A1A" stroke-width="0.8" opacity="0.2">
    <path d="M205,60 A 45,50 0 0,1 205,200"/>
    <path d="M245,58 A 85,95 0 0,1 245,202"/>
    <path d="M290,55 A 130,145 0 0,1 290,205"/>
  </g>

  <!-- ── CAMERA WALL MOUNT ── -->
  <!-- Wall bracket plate -->
  <rect x="58" y="30" width="28" height="48" rx="4" fill="#1E2C3C" stroke="#3A4A5C" stroke-width="1.5"/>
  <rect x="63" y="35" width="18" height="6" rx="2" fill="#2A3A4C"/>
  <rect x="63" y="45" width="18" height="6" rx="2" fill="#2A3A4C"/>
  <rect x="63" y="55" width="18" height="6" rx="2" fill="#2A3A4C"/>
  <!-- Mounting screws -->
  <circle cx="65" cy="34" r="2.5" fill="#3A4A5C"/><line x1="63" y1="34" x2="67" y2="34" stroke="#1A2535" stroke-width="0.8"/>
  <circle cx="79" cy="34" r="2.5" fill="#3A4A5C"/><line x1="77" y1="34" x2="81" y2="34" stroke="#1A2535" stroke-width="0.8"/>
  <circle cx="65" cy="72" r="2.5" fill="#3A4A5C"/>
  <circle cx="79" cy="72" r="2.5" fill="#3A4A5C"/>

  <!-- Pivot arm -->
  <rect x="82" y="48" width="44" height="11" rx="5" fill="#2A3A4C" stroke="#3A4A5C" stroke-width="1.5"/>
  <!-- Tilt pivot -->
  <circle cx="125" cy="53" r="7" fill="#1E2C3C" stroke="#3A4A5C" stroke-width="1.5"/>
  <circle cx="125" cy="53" r="3" fill="#3A4A5C"/>

  <!-- ── CAMERA BODY ── -->
  <path d="M120,35 L168,35 L175,53 L168,72 L120,72 L114,53 Z" fill="#1A2535" stroke="#3A4A5C" stroke-width="1.5"/>
  <!-- Camera body highlight -->
  <path d="M122,37 L165,37 L170,53 L165,70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- IR LED ring around lens -->
  <circle cx="148" cy="53" r="20" fill="#111820" stroke="#2B3A4A" stroke-width="1"/>
  <!-- IR LEDs -->
  <g fill="#E05A1A" filter="url(#glow)">
    <circle cx="148" cy="33" r="2.5" opacity="0.8"/>
    <circle cx="162" cy="39" r="2.5" opacity="0.8"/>
    <circle cx="168" cy="53" r="2.5" opacity="0.8"/>
    <circle cx="162" cy="67" r="2.5" opacity="0.8"/>
    <circle cx="148" cy="73" r="2.5" opacity="0.8"/>
    <circle cx="134" cy="67" r="2.5" opacity="0.8"/>
    <circle cx="128" cy="53" r="2.5" opacity="0.8"/>
    <circle cx="134" cy="39" r="2.5" opacity="0.8"/>
  </g>

  <!-- Lens assembly -->
  <circle cx="148" cy="53" r="15" fill="url(#lensInner)" stroke="#3A4A5C" stroke-width="1.5"/>
  <circle cx="148" cy="53" r="10" fill="#070E18" stroke="#2B3A4A" stroke-width="1"/>
  <circle cx="148" cy="53" r="5.5" fill="#0A1828"/>
  <!-- Lens reflection -->
  <ellipse cx="143" cy="47" rx="4" ry="2.5" fill="white" opacity="0.12" transform="rotate(-30,143,47)"/>
  <!-- Lens aperture dot -->
  <circle cx="148" cy="53" r="2" fill="#1A3A5C"/>

  <!-- Recording indicator -->
  <circle cx="120" cy="38" r="4" fill="#C0392B" filter="url(#glow)"/>
  <circle cx="120" cy="38" r="2" fill="#FF4444"/>

  <!-- ── MONITOR / FEED (right side) ── -->
  <rect x="255" y="78" width="125" height="88" rx="5" fill="#111820" stroke="#2B3A4A" stroke-width="1.5"/>
  <!-- Screen bezel -->
  <rect x="263" y="85" width="109" height="68" rx="3" fill="#0A0E14"/>
  <!-- Live feed display -->
  <rect x="263" y="85" width="109" height="68" rx="3" fill="#0A1420"/>
  <!-- Feed scan lines -->
  <g stroke="#E05A1A" stroke-width="0.5" opacity="0.12">
    <line x1="263" y1="90" x2="372" y2="90"/><line x1="263" y1="95" x2="372" y2="95"/>
    <line x1="263" y1="100" x2="372" y2="100"/><line x1="263" y1="105" x2="372" y2="105"/>
    <line x1="263" y1="110" x2="372" y2="110"/><line x1="263" y1="115" x2="372" y2="115"/>
    <line x1="263" y1="120" x2="372" y2="120"/><line x1="263" y1="125" x2="372" y2="125"/>
    <line x1="263" y1="130" x2="372" y2="130"/><line x1="263" y1="135" x2="372" y2="135"/>
    <line x1="263" y1="140" x2="372" y2="140"/><line x1="263" y1="145" x2="372" y2="145"/>
    <line x1="263" y1="150" x2="372" y2="150"/>
  </g>
  <!-- Timestamp overlay -->
  <text x="268" y="96" font-family="monospace" font-size="7" fill="#E05A1A" opacity="0.9">2026-06-08  23:14:05</text>
  <!-- Camera ID -->
  <text x="268" y="105" font-family="monospace" font-size="7" fill="#7A8699">CAM-04 / PERIMETER-N</text>
  <!-- Detection box on feed -->
  <rect x="290" y="112" width="45" height="30" fill="none" stroke="#E05A1A" stroke-width="1.2" opacity="0.8"/>
  <text x="290" y="110" font-family="monospace" font-size="6" fill="#E05A1A">MOTION DETECTED</text>
  <!-- Person silhouette in feed -->
  <ellipse cx="312" cy="121" rx="5" ry="5" fill="#2A3A4C"/>
  <rect x="307" y="126" width="10" height="14" rx="2" fill="#2A3A4C"/>
  <!-- REC badge -->
  <rect x="326" y="88" width="40" height="13" rx="2" fill="#C0392B" opacity="0.9"/>
  <text x="346" y="98" font-family="monospace" font-size="8" fill="white" text-anchor="middle" font-weight="bold">● REC</text>
  <!-- Monitor stand -->
  <rect x="308" y="166" width="20" height="8" rx="2" fill="#1A2535" stroke="#2B3340" stroke-width="1"/>
  <rect x="296" y="172" width="44" height="5" rx="2" fill="#1A2535" stroke="#2B3340" stroke-width="1"/>

  <!-- Cable from camera to monitor -->
  <path d="M170,55 Q220,55 240,90 L255,100" fill="none" stroke="#2B3340" stroke-width="2" stroke-dasharray="6,3"/>
</svg>
