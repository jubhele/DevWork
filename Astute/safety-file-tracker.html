<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APS-EHS-FRM-010 · Safety File Tracker — Archon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── BlackFire Light Token System ── */
:root {
  --bg:#F5F1EA; --surface:#FFFFFF; --surface2:#EDE8DE; --surface3:#E4DED2;
  --border:#C8C1B3; --border2:#B8B1A3;
  --text:#1A1814; --text2:#4A4638; --muted:#7A7566; --muted2:#5A5448;
  --accent:#C94A10; --accent2:#E05A1A; --accent-pale:#F5EDE8;
  --red:#A82A1E;    --red-bg:rgba(168,42,30,.08);   --red-bdr:rgba(168,42,30,.25);
  --amber:#9A6A0A;  --amber-bg:rgba(212,138,21,.1);  --amber-bdr:rgba(212,138,21,.28);
  --green:#1A6633;  --green-bg:rgba(26,122,64,.08);  --green-bdr:rgba(26,122,64,.25);
  --blue:#2563EB;   --blue-bg:rgba(59,130,246,.07);  --blue-bdr:rgba(59,130,246,.2);
  --row-odd:#FAFAF8; --row-even:#FFFFFF; --row-hover:rgba(200,193,179,.28);
  --scrolltrack:#EDE8DE; --scrollthumb:#C8C1B3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:13px;
     background:var(--bg);color:var(--text);min-height:100vh;position:relative}

/* grid watermark */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),
                   linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:40px 40px;opacity:.18}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--scrolltrack)}
::-webkit-scrollbar-thumb{background:var(--scrollthumb);border-radius:2px}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:300;background:var(--surface);
  border-bottom:2px solid var(--accent);box-shadow:0 1px 8px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;gap:16px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--accent)}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--muted)}

/* ── SCORE RING ── */
.score-block{display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface3);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset .6s ease, stroke .4s}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.1}
.ring-pct{font-size:13px;font-weight:700}
.ring-tag{font-size:8px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.score-meta{font-size:11px;color:var(--muted2);line-height:1.9}
.score-meta strong{color:var(--accent)}

/* ── CONTROLS ── */
.controls{padding:10px 24px;background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.controls select,.controls input{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:6px 10px;border-radius:5px;
  font-family:inherit;font-size:12px;transition:border-color .15s}
.controls select:focus,.controls input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(201,74,16,.12)}
.btn{font-size:12px;font-family:inherit;font-weight:600;padding:6px 16px;
  border-radius:5px;border:none;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-spacer{flex:1}

/* ── PROGRESS BAR ── */
.prog-bar-wrap{background:var(--surface2);position:relative;z-index:1}
.prog-bar-bg{height:3px;background:var(--surface3)}
.prog-bar-fill{height:3px;background:var(--accent);transition:width .5s ease}

/* ── SECTION GROUPS ── */
.section-group{margin:20px 24px 0;position:relative;z-index:1}
.section-head{display:flex;align-items:center;gap:10px;
  padding:9px 16px;background:var(--surface);
  border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:6px 6px 0 0;cursor:pointer;user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.section-head h2{font-size:12px;font-weight:700;color:var(--accent);flex:1;
  letter-spacing:.01em;text-transform:uppercase}
.section-head .s-stats{font-size:10px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.section-head .chevron{font-size:11px;color:var(--muted);transition:transform .2s}
.section-head.collapsed .chevron{transform:rotate(-90deg)}
.section-head.collapsed{border-radius:6px}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-top:none;
  border-radius:0 0 6px 6px;margin-bottom:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.05)}
table{border-collapse:collapse;width:100%;min-width:720px}
thead th{background:var(--surface2);color:var(--text2);padding:8px 14px;text-align:left;
  border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tbody td{padding:8px 14px;border-right:1px solid var(--surface3);
  border-bottom:1px solid var(--surface3);vertical-align:top;color:var(--text2);font-size:12px}
tbody tr:nth-child(odd)  td{background:var(--row-odd)}
tbody tr:nth-child(even) td{background:var(--row-even)}
tbody tr:hover td{background:var(--row-hover)}
tbody tr.hidden{display:none}

td.num{color:var(--muted);width:48px;text-align:center;font-size:11px;font-weight:600}
td.criteria{max-width:260px;line-height:1.55;color:var(--text)}
td.comment{max-width:220px;color:var(--muted2);font-size:11px;line-height:1.5;font-style:italic}
td.status-cell{width:130px}
td.notes-cell{min-width:160px}

/* ── STATUS SELECT ── */
.status-sel{width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:5px 8px;border-radius:4px;font-family:inherit;font-size:11px;
  font-weight:600;cursor:pointer;transition:all .15s}
.status-sel:focus{outline:none}
.status-sel.s-open {background:var(--red-bg);  border-color:var(--red-bdr);  color:var(--red)}
.status-sel.s-wip  {background:var(--amber-bg);border-color:var(--amber-bdr);color:var(--amber)}
.status-sel.s-done {background:var(--green-bg);border-color:var(--green-bdr);color:var(--green)}
.status-sel.s-na   {background:var(--surface2);border-color:var(--border);   color:var(--muted)}

/* ── NOTES INPUT ── */
.notes-in{width:100%;background:transparent;border:1px solid transparent;
  color:var(--muted2);padding:4px 6px;border-radius:4px;font-family:inherit;font-size:11px;
  resize:none;transition:border-color .15s}
.notes-in:focus{outline:none;border-color:var(--border);background:var(--surface);
  box-shadow:0 0 0 2px rgba(201,74,16,.08)}
.notes-in::placeholder{color:var(--border2)}

/* ── PRIORITY DOT ── */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;
     margin-right:6px;flex-shrink:0;vertical-align:middle}
.p-high .dot{background:var(--red)}
.p-med  .dot{background:var(--amber)}
.p-low  .dot{background:var(--blue)}

/* ── PILLS ── */
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.pill-fail{background:var(--red-bg);  color:var(--red);  border:1px solid var(--red-bdr)}
.pill-pass{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.pill-na  {background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.pill-wip {background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr)}

/* ── LEGEND ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);
  padding:8px 24px;border-bottom:1px solid var(--border);background:var(--surface);
  position:relative;z-index:1}
.legend span{display:flex;align-items:center;gap:5px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);
  color:var(--surface);padding:10px 18px;
  border-radius:6px;font-size:12px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;
  box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}

/* ── SUBMISSION BANNER ── */
.submit-banner{display:none;align-items:center;gap:16px;padding:11px 24px;
  background:var(--green-bg);border-bottom:2px solid var(--green-bdr);
  position:relative;z-index:1;flex-wrap:wrap}
.sb-check{font-size:20px;color:var(--green);flex-shrink:0;line-height:1}
.sb-meta{flex:1;min-width:180px}
.sb-meta strong{font-size:13px;color:var(--green);display:block;line-height:1.4}
.sb-meta span{font-size:11px;color:var(--muted2)}
.sb-score-pill{background:var(--green);color:#fff;padding:5px 14px;
  border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.sb-resubmit{font-size:11px;font-family:inherit;font-weight:600;padding:5px 12px;
  border-radius:5px;border:1px solid var(--green-bdr);background:transparent;
  color:var(--green);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.sb-resubmit:hover{background:var(--green);color:#fff}

/* ── FOOTER PAD ── */
#content{padding-bottom:40px}

/* ── PRINT ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body::before{display:none}
  .topbar{position:static!important;box-shadow:none}
  .controls,.prog-bar-wrap{display:none!important}
  .section-group{page-break-inside:avoid;margin:12px 0}
  .tbl-wrap{box-shadow:none}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="brand">
    APS-EHS-FRM-010
    <small>Archon · Contractor Safety File Tracker · Audit: 2026-05-18</small>
  </div>
  <div class="score-block">
    <div class="ring-wrap">
      <svg viewBox="0 0 64 64" width="64" height="64">
        <circle class="ring-bg" cx="32" cy="32" r="27"/>
        <circle class="ring-fill" id="ringFill" cx="32" cy="32" r="27"
          stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
      </svg>
      <div class="ring-label">
        <span class="ring-pct" id="ringPct">0%</span>
        <span class="ring-tag" id="ringTag">RED</span>
      </div>
    </div>
    <div class="score-meta" id="scoreMeta">
      Loading…
    </div>
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="prog-bar-wrap">
  <div class="prog-bar-bg"><div class="prog-bar-fill" id="progBar" style="width:0%"></div></div>
</div>

<!-- SUBMISSION BANNER -->
<div class="submit-banner" id="submitBanner">
  <div class="sb-check">&#10003;</div>
  <div class="sb-meta">
    <strong>Safety File Submitted</strong>
    <span id="sbDetail">—</span>
  </div>
  <div class="sb-score-pill" id="sbScorePill">—</div>
  <button class="sb-resubmit" onclick="submitFile()">Re-Submit</button>
</div>

<!-- CONTROLS -->
<div class="controls">
  <select id="filterSection">
    <option value="">All Sections</option>
    <option value="A">A — Agreement</option>
    <option value="B">B — Risk Management</option>
    <option value="C">C — Medical Fitness</option>
    <option value="D">D — Training &amp; Induction</option>
    <option value="E">E — Operations</option>
    <option value="F">F — Equipment</option>
    <option value="G">G — Emergency Preparedness</option>
    <option value="H">H — Legal Appointments</option>
  </select>
  <select id="filterStatus">
    <option value="">All Statuses</option>
    <option value="open">Open</option>
    <option value="wip">In Progress</option>
    <option value="done">Fixed</option>
    <option value="na">N/A</option>
  </select>
  <input type="text" id="search" placeholder="Search items…" style="min-width:160px">
  <div class="ctrl-spacer"></div>
  <button class="btn btn-ghost" onclick="resetAll()">Reset All</button>
  <button class="btn btn-ghost" id="btnSubmit" onclick="submitFile()" style="border-color:var(--green-bdr);color:var(--green)">Submit File</button>
  <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
</div>

<!-- LEGEND -->
<div class="legend">
  <span><span style="width:9px;height:9px;border-radius:2px;background:var(--red);display:inline-block"></span> Open</span>
  <span><span style="width:9px;height:9px;border-radius:2px;background:var(--amber);display:inline-block"></span> In Progress</span>
  <span><span style="width:9px;height:9px;border-radius:2px;background:var(--green);display:inline-block"></span> Fixed</span>
  <span><span style="width:9px;height:9px;border-radius:2px;background:var(--border2);display:inline-block"></span> N/A</span>
  <span style="margin-left:14px"><span class="dot" style="background:var(--red)"></span> High priority</span>
  <span><span class="dot" style="background:var(--amber)"></span> Medium</span>
  <span><span class="dot" style="background:var(--blue)"></span> Low / admin</span>
</div>

<div id="content"></div>
<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const SECTIONS = [
  {
    id:'A', label:'Section A — Agreement',
    items:[
      {id:'A2', ref:'Sec 37.2', criteria:'Written contract (SLA or 37.2 agreement) between APS & Archon', comment:'Not to Standard — no signed agreement in file', priority:'high'},
      {id:'A3', ref:'CR5', criteria:'APS representative written appointment of principal contractor', comment:'Not to Standard — appointment letter not in file', priority:'high'},
      {id:'A6', ref:'CR 4(1)', criteria:'Notification of Construction Work form', comment:'No signature by Client and no DoL stamp', priority:'high'},
      {id:'A8', ref:'OHS Act S7', criteria:'Health and Safety / EHS Policies', comment:'Doc 5.01 exists but no proof of communication to staff', priority:'med'},
    ]
  },
  {
    id:'B', label:'Section B — Risk Management',
    items:[
      {id:'B3', ref:'CR5(1)', criteria:'Baseline Risk Assessment', comment:'Blank register attached — not completed', priority:'high'},
      {id:'B4', ref:'AECI', criteria:'Continuous Risk Assessments', comment:'Blank register attached — not completed', priority:'high'},
      {id:'B5', ref:'CR9(1)e', criteria:'Risk Review Plan', comment:'Not submitted at all', priority:'high'},
      {id:'B6', ref:'CR9(1)c', criteria:"Safe Work / Operating Procedures (list of all SOPs)", comment:'Only manual handling policy submitted — full SOP list required', priority:'med'},
    ]
  },
  {
    id:'C', label:'Section C — Medical Fitness',
    items:[
      {id:'C2', ref:'—', criteria:'Drug & Alcohol Policy — proof of communication & complete documents', comment:'No specific proof of communication. Documents not properly completed', priority:'med'},
    ]
  },
  {
    id:'D', label:'Section D — Employees, Training, Competency & Induction',
    items:[
      {id:'D1', ref:'—', criteria:'Proof of Company Induction', comment:'Tshepo Jantjie missing from induction. Medicals don\'t match site personnel list', priority:'high'},
      {id:'D2', ref:'—', criteria:'Training Matrix', comment:'Blank document attached — must be completed for all 3 employees', priority:'high'},
      {id:'D3', ref:'—', criteria:'Competency records as per Training Matrix', comment:'No certificates or records attached', priority:'high'},
      {id:'D4', ref:'CR29(j)', criteria:'List of workers trained in fire extinguisher use', comment:'Not submitted', priority:'med'},
      {id:'D5', ref:'CR10(2)c', criteria:'Working at heights training programme & records', comment:'Camera work = height risk. Train and certify all site workers', priority:'high'},
      {id:'D6', ref:'—', criteria:'Proof of AECI / site-specific induction (before commencing work)', comment:'No names listed — attach signed induction register for all site personnel', priority:'high'},
    ]
  },
  {
    id:'E', label:'Section E — Operations (SHE Plan, Fall Protection, Environmental, Incident, PPE)',
    items:[
      {id:'E1', ref:'CR7(1)a', criteria:'Documented Health & Safety Plan', comment:'Incomplete — SHE budget allocation signatures missing. No proof of communication', priority:'high'},
      {id:'E3', ref:'CR10(1)a', criteria:'Fall Protection Plan (by trained Fall Protection Planner)', comment:'No named developer. Not an approved document. No proof of communication', priority:'high'},
      {id:'E4', ref:'CR10(1)b', criteria:'Fall Protection Risk Assessment for all work at height', comment:'Blank risk register — must be completed per location', priority:'high'},
      {id:'E7', ref:'—', criteria:'Incident Management Procedure', comment:'Procedure not approved by Director. No proof of communication', priority:'high'},
      {id:'E9', ref:'—', criteria:'PPE Management Procedure', comment:'Doc 5.04 exists — add proof of communication to staff', priority:'med'},
      {id:'E10', ref:'—', criteria:'Proof of training on PPE (limitations, use and care)', comment:'Section 6 of Doc 05.04 referenced but no actual training records attached', priority:'med'},
      {id:'E12', ref:'—', criteria:'Proof of PPE inspections conducted', comment:'Blank checklist attached. No evidence that 6-monthly inspections are being done', priority:'med'},
    ]
  },
  {
    id:'F', label:'Section F — Control & Maintenance of Equipment',
    items:[
      {id:'F1', ref:'—', criteria:"Equipment Register (vehicles, LDVs, tools)", comment:'Blank register — list all equipment used on site', priority:'med'},
      {id:'F2', ref:'—', criteria:'Statutory & mandatory scheduled inspections', comment:'Weekly schedule exists but no proof of compliance / completed inspection records', priority:'med'},
      {id:'F3', ref:'—', criteria:'Maintenance Records', comment:'Not submitted', priority:'med'},
    ]
  },
  {
    id:'G', label:'Section G — Emergency Preparedness',
    items:[
      {id:'G1', ref:'CR29(i)', criteria:'Emergency Preparedness Procedure & proof of training', comment:'Plan not approved. No proof of communication to staff', priority:'high'},
      {id:'G3', ref:'GSR3', criteria:'Fire extinguisher inspections, maintenance & proof', comment:'Quote for annual service in file but no proof of actual inspections performed', priority:'med'},
    ]
  },
  {
    id:'H', label:'Section H — Legal Appointments',
    items:[
      {id:'H3', ref:'Sec 17', criteria:'SHE Representative — Kitso Marupi', comment:'No proof of competency / training certificate attached', priority:'high'},
      {id:'H11', ref:'CR9(1)', criteria:'Risk Assessor — Kitso Marupi', comment:'No proof of competency / training certificate attached', priority:'high'},
      {id:'H12', ref:'CR10(1)', criteria:'Fall Protection Planner', comment:'No qualified planner named. Risk assessment only mentions a ladder — planner required', priority:'high'},
      {id:'H31', ref:'CR29(h)', criteria:'Fire Equipment Inspector', comment:'Appointment not supplied', priority:'med'},
      {id:'H32', ref:'GAR9(2)', criteria:'Incident Investigator', comment:'No proof of competency', priority:'med'},
      {id:'H33', ref:'GSR3(1)', criteria:'First Aider', comment:'Not supplied — appoint trained first aider and attach appointment + certificate', priority:'high'},
    ]
  }
];

const TOTAL_APPLICABLE = SECTIONS.reduce((t,s)=>t+s.items.length,0); // 33 failing items

// ── STATE (localStorage) ──────────────────────────────────────────────────
const KEY = 'archon_safety_tracker_v1';
function loadState(){
  try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }
  catch{ return {}; }
}
function saveState(state){ localStorage.setItem(KEY, JSON.stringify(state)); }
let state = loadState();

function getStatus(id){ return state[id]?.status || 'open'; }
function getNotes(id) { return state[id]?.notes  || ''; }
function setStatus(id,v){ state[id] = {...(state[id]||{}), status:v}; saveState(state); updateScore(); applyFilters(); }
function setNotes(id,v) { state[id] = {...(state[id]||{}), notes:v};  saveState(state); }

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const container = document.getElementById('content');
  container.innerHTML = '';
  SECTIONS.forEach(sec => {
    const group = document.createElement('div');
    group.className = 'section-group';
    group.dataset.section = sec.id;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <h2>${sec.label}</h2>
      <div class="s-stats" id="stats-${sec.id}"></div>
      <span class="chevron">▾</span>`;
    head.onclick = () => {
      const body = document.getElementById('tbody-'+sec.id).closest('.tbl-wrap');
      const collapsed = head.classList.toggle('collapsed');
      body.style.display = collapsed ? 'none' : '';
    };

    const wrap = document.createElement('div');
    wrap.className = 'tbl-wrap';
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th style="width:60px">Ref</th>
            <th>Criteria</th>
            <th>Audit Comment</th>
            <th style="width:130px">Status</th>
            <th>Notes / Action</th>
          </tr>
        </thead>
        <tbody id="tbody-${sec.id}"></tbody>
      </table>`;

    group.appendChild(head);
    group.appendChild(wrap);
    container.appendChild(group);

    const tbody = document.getElementById('tbody-'+sec.id);
    sec.items.forEach(item => {
      const tr = document.createElement('tr');
      tr.className = `p-${item.priority}`;
      tr.dataset.id = item.id;
      tr.dataset.section = sec.id;
      tr.dataset.criteria = item.criteria.toLowerCase();
      tr.dataset.comment = item.comment.toLowerCase();

      const st = getStatus(item.id);
      const nt = getNotes(item.id);

      tr.innerHTML = `
        <td class="num"><span class="dot"></span>${item.id}</td>
        <td style="font-size:9px;color:var(--muted);white-space:nowrap">${item.ref}</td>
        <td class="criteria">${item.criteria}</td>
        <td class="comment">${item.comment}</td>
        <td class="status-cell">
          <select class="status-sel s-${st}" data-id="${item.id}" onchange="statusChanged(this)">
            <option value="open"  ${st==='open' ?'selected':''}>Open</option>
            <option value="wip"   ${st==='wip'  ?'selected':''}>In Progress</option>
            <option value="done"  ${st==='done' ?'selected':''}>Fixed ✓</option>
            <option value="na"    ${st==='na'   ?'selected':''}>N/A</option>
          </select>
        </td>
        <td class="notes-cell">
          <textarea class="notes-in" rows="2" data-id="${item.id}"
            placeholder="Add action / owner / date…"
            onchange="notesChanged(this)">${escHtml(nt)}</textarea>
        </td>`;
      tbody.appendChild(tr);
    });
  });

  updateScore();
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusChanged(sel){
  const id = sel.dataset.id;
  sel.className = 'status-sel s-'+sel.value;
  setStatus(id, sel.value);
  toast(`${id} → ${sel.options[sel.selectedIndex].text}`);
}

function notesChanged(ta){
  setNotes(ta.dataset.id, ta.value);
}

// ── SCORE ─────────────────────────────────────────────────────────────────
function updateScore(){
  let done=0, wip=0, open=0, na=0;
  SECTIONS.forEach(sec => {
    let sd=0,sw=0,so=0,sna=0;
    sec.items.forEach(item => {
      const st = getStatus(item.id);
      if(st==='done') {done++;sd++;}
      else if(st==='wip'){wip++;sw++;}
      else if(st==='na') {na++;sna++;}
      else              {open++;so++;}
    });
    const el = document.getElementById('stats-'+sec.id);
    if(el){
      el.innerHTML = `
        <span class="pill pill-fail">${so} open</span>
        ${sw?`<span class="pill pill-wip">${sw} wip</span>`:''}
        ${sd?`<span class="pill pill-pass">${sd} fixed</span>`:''}
        ${sna?`<span class="pill pill-na">${sna} n/a</span>`:''}`;
    }
  });

  const applicable = TOTAL_APPLICABLE - na;
  const pct = applicable > 0 ? Math.round((done / applicable)*100) : 0;

  // Original audit baseline (13 passed of 45 applicable = 28.89%)
  // New projected score adds "done" items to the original 13 passes
  // Original: 13 to-standard of 45 applicable
  const origPass = 13, origApplicable = 45;
  const newPass = origPass + done;
  const newApplicable = origApplicable; // N/A count stays same from audit
  const projectedScore = Math.round((newPass / newApplicable)*100*100)/100;

  const ringFill = document.getElementById('ringFill');
  const ringPct  = document.getElementById('ringPct');
  const ringTag  = document.getElementById('ringTag');
  const scoreEl  = document.getElementById('scoreMeta');
  const progBar  = document.getElementById('progBar');

  const circumference = 169.6;
  const offset = circumference - (projectedScore/100)*circumference;
  ringFill.style.strokeDashoffset = offset;

  let color, tag;
  if(projectedScore >= 90)     { color='#22c55e'; tag='GREEN'; }
  else if(projectedScore >= 75){ color='#f59e0b'; tag='YELLOW'; }
  else if(projectedScore >= 51){ color='#f97316'; tag='ORANGE'; }
  else                          { color='#ef4444'; tag='RED'; }

  ringFill.style.stroke = color;
  ringPct.style.color = color;
  ringPct.textContent = projectedScore.toFixed(1)+'%';
  ringTag.textContent = tag;
  ringTag.style.color = color;

  progBar.style.width = pct+'%';
  progBar.style.background = color;

  const sub = state._submission;
  const subLine = sub
    ? `Submitted: <strong style="color:var(--green)">${sub.score.toFixed(1)}% (${sub.tag})</strong> on ${fmtDate(sub.at)}<br>`
    : '';

  scoreEl.innerHTML = `
    Projected score: <strong>${projectedScore.toFixed(1)}%</strong> (${tag})<br>
    Baseline audit:  <strong>28.89%</strong> (RED)<br>
    ${subLine}
    Fixed: <strong style="color:var(--green)">${done}</strong> / ${TOTAL_APPLICABLE} &nbsp;
    WIP: <strong style="color:var(--amber)">${wip}</strong> &nbsp;
    Open: <strong style="color:var(--red)">${open}</strong>`;
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'})
       + ' ' + d.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
}

// ── FILTERS ───────────────────────────────────────────────────────────────
function applyFilters(){
  const sec = document.getElementById('filterSection').value;
  const st  = document.getElementById('filterStatus').value;
  const q   = document.getElementById('search').value.toLowerCase();

  document.querySelectorAll('.section-group').forEach(grp => {
    const gid = grp.dataset.section;
    let anyVisible = false;
    grp.querySelectorAll('tbody tr').forEach(tr => {
      const matchSec = !sec || tr.dataset.section === sec;
      const matchSt  = !st  || getStatus(tr.dataset.id) === st;
      const matchQ   = !q   || tr.dataset.criteria.includes(q) || tr.dataset.comment.includes(q)
                             || tr.dataset.id.toLowerCase().includes(q);
      const show = matchSec && matchSt && matchQ;
      tr.classList.toggle('hidden', !show);
      if(show) anyVisible = true;
    });
    grp.style.display = (!sec || gid===sec) ? '' : 'none';
  });
}

document.getElementById('filterSection').onchange = applyFilters;
document.getElementById('filterStatus').onchange  = applyFilters;
document.getElementById('search').oninput         = applyFilters;

// ── RESET ─────────────────────────────────────────────────────────────────
function resetAll(){
  if(!confirm('Reset all statuses and notes to blank?')) return;
  state = {};
  saveState(state);
  render();
  renderSubmission();
  toast('All statuses reset.');
}

function submitFile(){
  let done=0, applicable=0;
  SECTIONS.forEach(sec => {
    sec.items.forEach(item => {
      const st = getStatus(item.id);
      if(st !== 'na') applicable++;
      if(st === 'done') done++;
    });
  });
  const pct   = parseFloat(document.getElementById('ringPct').textContent);
  const tag   = document.getElementById('ringTag').textContent;
  const label = state._submission ? 'Re-submit' : 'Submit';
  if(!confirm(`${label} this safety file at ${pct.toFixed(1)}% (${tag})?\n\nThis records the current score and timestamp.`)) return;
  state._submission = { at: new Date().toISOString(), score: pct, tag, done, applicable };
  saveState(state);
  renderSubmission();
  updateScore();
  toast(`File submitted at ${pct.toFixed(1)}%`);
}

function renderSubmission(){
  const banner = document.getElementById('submitBanner');
  const btn    = document.getElementById('btnSubmit');
  const sub    = state._submission;
  if(!sub){
    banner.style.display = 'none';
    if(btn) btn.textContent = 'Submit File';
    return;
  }
  document.getElementById('sbDetail').textContent =
    `Submitted ${fmtDate(sub.at)} · ${sub.done} of ${sub.applicable} items resolved`;
  document.getElementById('sbScorePill').textContent = `${sub.score.toFixed(1)}% ${sub.tag}`;
  banner.style.display = 'flex';
  if(btn) btn.textContent = 'Re-Submit';
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

// ── BOOT ─────────────────────────────────────────────────────────────────
render();
renderSubmission();
</script>
</body>
</html>
