<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root{--aurum:#C2A04A;--champ:#E2CD93;--bone:#DDE4EC;--ash:#93A4B8;--mid:#0A1626;--harbor:#0F2138;--div:#244360;}
  body{background:var(--mid);margin:0;padding:40px;font-family:'IBM Plex Mono',monospace;}
  h1{color:var(--bone);font-family:'Jost';font-weight:300;font-size:22px;letter-spacing:.12em;margin:0 0 4px;}
  .sub{color:#93A4B8;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:34px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--div);border:1px solid var(--div);}
  .cell{background:var(--harbor);padding:60px 56px;display:flex;flex-direction:column;gap:34px;min-height:210px;justify-content:center;}
  .cell.paper{background:#F4F0E6;}
  .cell.black{background:#000;}
  .cell.white{background:#FFF;}
  .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#93A4B8;}
  .cell.paper .tag,.cell.white .tag{color:#7C715A;}
  .cell.black .tag{color:#7E7E7E;}

  /* ---- composite lockup ---- */
  .lk{display:inline-flex;align-items:stretch;gap:26px;}
  .lk__left{display:flex;flex-direction:column;}
  .lk__word{display:inline-flex;align-items:flex-end;line-height:1;font-size:58px;}
  .lk__word .w{font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.04em;}
  .lk__word svg{display:block;margin-right:4px;margin-bottom:-3px;}
  .lk__desc{font-family:'IBM Plex Mono';font-size:12.5px;margin-top:20px;display:flex;justify-content:space-between;}
  .lk__right{display:flex;align-items:center;gap:18px;}
  .lk__vrule{width:1px;align-self:stretch;}
  .lk__data{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.3em;line-height:1.75;}
</style></head><body>
<h1>Astute Insights · Composite Lockup</h1>
<div class="sub">Astute over Insights · Data Intelligence spanning both lines · no rule</div>

<div class="grid" id="grid"></div>

<script>
function chev(c){return `<svg viewBox="24 18 72 76" width="40" height="48"><path d="M30,86 L60,24 L90,86" fill="none" stroke="${c}" stroke-width="3.4"/><circle cx="60" cy="62" r="4.6" fill="${c}"/></svg>`;}
// mark, word, desc, vrule, data colours
function lk(o){
  // o.font:'jost' renders the descriptor words in the same Jost face as 'stute'
  const jost = o.font==='jost';
  const descStyle = jost
    ? `color:${o.desc};font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.34em;text-transform:uppercase`
    : `color:${o.desc}`;
  const dataStyle = jost
    ? `color:${o.data};font-family:'Jost',sans-serif;font-weight:300;letter-spacing:.12em;text-transform:uppercase`
    : `color:${o.data}`;
  const insights = jost
    ? `INSIGHTS`
    : `<span>I</span><span>N</span><span>S</span><span>I</span><span>G</span><span>H</span><span>T</span><span>S</span>`;
  return `<div class="lk">
    <div class="lk__left">
      <div class="lk__word">${chev(o.mark)}<span class="w" style="color:${o.word}">stute</span></div>
      <div class="lk__desc" style="${descStyle}">${insights}</div>
    </div>
    <div class="lk__right">
      <div class="lk__vrule" style="background:${o.vrule}"></div>
      <div class="lk__data" style="${dataStyle}">DATA<br>INTELLIGENCE</div>
    </div>
  </div>`;
}
const A='#C2A04A',C='#E2CD93',B='#DDE4EC',S='#93A4B8',D='#244360';
const items=[
  ['cell','01 · Gold throughout (primary)', lk({mark:A,word:A,desc:A,vrule:D,data:A})],
  ['cell','02 · Gold mark · ivory word · gold tags', lk({mark:A,word:B,desc:A,vrule:D,data:A})],
  ['cell','03 · Gold word · ivory “Insights” · ash “Data”', lk({mark:A,word:A,desc:B,vrule:D,data:S})],
  ['cell','04 · Champagne word · gold tags', lk({mark:C,word:C,desc:A,vrule:D,data:A})],
  ['cell','05 · Monochrome ivory · gold mark', lk({mark:A,word:B,desc:B,vrule:'#3A4658',data:B})],
  ['paper','06 · On paper — descriptor set in Jost (matches “stute”)', lk({mark:A,word:'#1A2433',desc:'#9A7C2C',vrule:'#C8BFA8',data:'#9A7C2C',font:'jost'})],
  ['black','07 · Black &amp; white — white on black', lk({mark:'#FFFFFF',word:'#FFFFFF',desc:'#FFFFFF',vrule:'#454545',data:'#FFFFFF'})],
  ['white','08 · Black &amp; white — black on white', lk({mark:'#000000',word:'#000000',desc:'#000000',vrule:'#CCCCCC',data:'#000000'})],
];
document.getElementById('grid').innerHTML = items.map(([cls,t,l])=>
  `<div class="cell ${cls}"><span class="tag">${t}</span>${l}</div>`
).join('');
</script>
</body></html>
