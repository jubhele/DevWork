[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govtender"
version = "0.1.0"
description = "SA government tender intelligence and proposal automation"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",

    # Task queue
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Config + env
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Auth
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",   # AES-256-GCM for vault

    # AI
    "anthropic>=0.28.0",

    # Crawling
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "httpx>=0.27.0",
    "scrapy>=2.11.0",

    # Document generation
    "python-docx>=1.1.0",
    "weasyprint>=61.0",

    # Email
    "resend>=1.0.0",

    # Billing
    "stripe>=9.0.0",

    # Storage (S3-compatible)
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",   # for FastAPI test client
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
