packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - babel-preset-expo@56.0.14
  - expo@56.0.8
  - '@expo/metro-runtime@56.0.16'
  - '@expo/config-plugins@56.0.10'
  - '@expo/config-types@56.0.7'
  - expo-splash-screen@56.0.11
