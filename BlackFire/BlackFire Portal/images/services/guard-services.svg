<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030"/>
      <stop offset="100%" stop-color="#0A0E19"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E05A1A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#E05A1A" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="55" x2="400" y2="55"/><line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="165" x2="400" y2="165"/>
    <line x1="100" y1="0" x2="100" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/><line x1="300" y1="0" x2="300" y2="220"/>
  </g>
  <!-- Guard silhouette -->
  <!-- Head -->
  <circle cx="160" cy="72" r="22" fill="#1E2530" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Cap -->
  <rect x="140" y="54" width="40" height="10" rx="5" fill="#141B26" stroke="#E05A1A" stroke-width="1"/>
  <rect x="136" y="62" width="48" height="5" rx="2.5" fill="#E05A1A"/>
  <!-- Body / uniform -->
  <path d="M120,96 L130,94 C138,92 145,90 160,90 C175,90 182,92 190,94 L200,96 L196,170 L124,170 Z" fill="#1E2530" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Uniform collar -->
  <path d="M148,90 L160,100 L172,90" fill="none" stroke="#E05A1A" stroke-width="1.5"/>
  <!-- Badge on chest -->
  <path d="M155,108 L160,105 L165,108 L165,118 L160,122 L155,118 Z" fill="url(#shieldGrad)"/>
  <text x="160" y="116" font-family="monospace" font-size="7" fill="white" text-anchor="middle" font-weight="bold">★</text>
  <!-- Shoulder epaulettes -->
  <rect x="120" y="94" width="20" height="8" rx="2" fill="#E05A1A" opacity="0.7"/>
  <rect x="180" y="94" width="20" height="8" rx="2" fill="#E05A1A" opacity="0.7"/>
  <!-- Arms -->
  <path d="M120,96 L98,145 L112,148 L130,105" fill="#1E2530" stroke="#2B3340" stroke-width="1.5"/>
  <path d="M200,96 L222,145 L208,148 L190,105" fill="#1E2530" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Hands/gloves -->
  <ellipse cx="105" cy="150" rx="10" ry="7" fill="#141B26" stroke="#2B3340" stroke-width="1"/>
  <ellipse cx="215" cy="150" rx="10" ry="7" fill="#141B26" stroke="#2B3340" stroke-width="1"/>
  <!-- Belt -->
  <rect x="124" y="148" width="72" height="10" rx="3" fill="#0A0E19" stroke="#E05A1A" stroke-width="1"/>
  <rect x="157" y="148" width="6" height="10" fill="#E05A1A" opacity="0.8"/>
  <!-- Radio on belt -->
  <rect x="182" y="145" width="10" height="16" rx="2" fill="#141B26" stroke="#2B3340" stroke-width="1"/>
  <!-- Trousers -->
  <path d="M124,158 L130,200 L150,200 L160,175 L170,200 L190,200 L196,158 Z" fill="#141B26" stroke="#2B3340" stroke-width="1.5"/>
  <!-- Large background shield -->
  <path d="M290,42 L350,42 L350,120 L320,145 L290,120 Z" fill="none" stroke="#E05A1A" stroke-width="1.5" opacity="0.2"/>
  <path d="M298,52 L342,52 L342,115 L320,132 L298,115 Z" fill="none" stroke="#E05A1A" stroke-width="1" opacity="0.15"/>
  <!-- Star in background shield -->
  <text x="320" y="105" font-family="monospace" font-size="38" fill="#E05A1A" text-anchor="middle" opacity="0.12">★</text>
</svg>
