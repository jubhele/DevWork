<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030"/>
      <stop offset="100%" stop-color="#0A0E19"/>
    </linearGradient>
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05A1A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E05A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#E05A1A" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="55" x2="400" y2="55"/><line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="165" x2="400" y2="165"/>
    <line x1="100" y1="0" x2="100" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/><line x1="300" y1="0" x2="300" y2="220"/>
  </g>
  <!-- Circuit board traces -->
  <g stroke="#E05A1A" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round">
    <polyline points="30,110 60,110 60,80 100,80 100,110 140,110"/>
    <polyline points="30,150 70,150 70,170 130,170 130,150 180,150"/>
    <polyline points="260,110 300,110 300,80 350,80"/>
    <polyline points="260,150 310,150 310,170 370,170"/>
    <polyline points="60,80 60,50 120,50"/>
    <polyline points="300,80 300,50 360,50"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="#E05A1A" opacity="0.35">
    <circle cx="60" cy="110" r="4"/><circle cx="100" cy="80" r="4"/><circle cx="100" cy="110" r="4"/>
    <circle cx="300" cy="110" r="4"/><circle cx="300" cy="80" r="4"/>
    <circle cx="60" cy="80" r="4"/><circle cx="60" cy="50" r="4"/><circle cx="300" cy="50" r="4"/>
    <circle cx="130" cy="170" r="4"/><circle cx="70" cy="150" r="4"/>
  </g>
  <!-- Control panel -->
  <rect x="140" y="55" width="120" height="130" rx="6" fill="#141B26" stroke="#E05A1A" stroke-width="1.5"/>
  <!-- Panel screen -->
  <rect x="150" y="65" width="100" height="55" rx="3" fill="#0A0E19" stroke="#2B3340" stroke-width="1"/>
  <!-- Alert glow -->
  <ellipse cx="200" cy="92" rx="35" ry="22" fill="url(#alertGlow)"/>
  <!-- Warning triangle on screen -->
  <polygon points="200,72 222,108 178,108" fill="none" stroke="#E05A1A" stroke-width="2.5"/>
  <line x1="200" y1="82" x2="200" y2="98" stroke="#E05A1A" stroke-width="2.5"/>
  <circle cx="200" cy="103" r="2.5" fill="#E05A1A"/>
  <!-- ALARM text -->
  <rect x="157" y="112" width="86" height="16" rx="2" fill="#C0392B" opacity="0.9"/>
  <text x="200" y="124" font-family="monospace" font-size="10" fill="white" text-anchor="middle" font-weight="bold">⚡ ALARM</text>
  <!-- Control buttons row 1 -->
  <g fill="#1E2530" stroke="#2B3340" stroke-width="1">
    <rect x="152" y="132" width="18" height="12" rx="2"/><rect x="174" y="132" width="18" height="12" rx="2"/>
    <rect x="196" y="132" width="18" height="12" rx="2"/><rect x="218" y="132" width="18" height="12" rx="2"/>
    <rect x="240" y="132" width="8" height="12" rx="2" fill="#E05A1A" stroke="#E05A1A"/>
  </g>
  <!-- Zone indicators -->
  <g font-family="monospace" font-size="7" fill="#7A8699" text-anchor="middle">
    <text x="161" y="141">Z1</text><text x="183" y="141">Z2</text>
    <text x="205" y="141">Z3</text><text x="227" y="141">Z4</text>
  </g>
  <!-- LED indicators -->
  <g>
    <circle cx="158" cy="152" r="4" fill="#4ade80"/><text x="167" y="155" font-family="monospace" font-size="7" fill="#7A8699">ARMED</text>
    <circle cx="158" cy="163" r="4" fill="#C0392B"/><text x="167" y="166" font-family="monospace" font-size="7" fill="#7A8699">ALERT</text>
    <circle cx="158" cy="174" r="4" fill="#F07820"/><text x="167" y="177" font-family="monospace" font-size="7" fill="#7A8699">POWER</text>
  </g>
  <!-- Keypad -->
  <rect x="216" y="148" width="36" height="30" rx="2" fill="#0A0E19" stroke="#2B3340" stroke-width="1"/>
  <g fill="#2B3340">
    <rect x="219" y="151" width="8" height="6" rx="1"/><rect x="230" y="151" width="8" height="6" rx="1"/><rect x="241" y="151" width="8" height="6" rx="1"/>
    <rect x="219" y="160" width="8" height="6" rx="1"/><rect x="230" y="160" width="8" height="6" rx="1"/><rect x="241" y="160" width="8" height="6" rx="1"/>
    <rect x="230" y="169" width="8" height="6" rx="1" fill="#E05A1A"/>
  </g>
</svg>
