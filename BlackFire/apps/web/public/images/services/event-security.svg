<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030"/>
      <stop offset="100%" stop-color="#0A0E19"/>
    </linearGradient>
    <linearGradient id="spot1" x1="50%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#F07820" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F07820" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spot2" x1="50%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E05A1A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E05A1A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#E05A1A" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="55" x2="400" y2="55"/><line x1="0" y1="110" x2="400" y2="110"/>
    <line x1="0" y1="165" x2="400" y2="165"/>
    <line x1="100" y1="0" x2="100" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/><line x1="300" y1="0" x2="300" y2="220"/>
  </g>
  <!-- Spotlights beams from top -->
  <polygon points="130,0 80,200 180,200" fill="url(#spot1)"/>
  <polygon points="270,0 220,200 320,200" fill="url(#spot2)"/>
  <!-- Stage / platform -->
  <rect x="0" y="175" width="400" height="45" fill="#141B26"/>
  <rect x="0" y="172" width="400" height="6" fill="#E05A1A" opacity="0.6"/>
  <!-- Stage lights bar top -->
  <rect x="30" y="15" width="340" height="16" rx="3" fill="#141B26" stroke="#2B3340" stroke-width="1.5"/>
  <g fill="#E05A1A">
    <circle cx="65" cy="23" r="6"/><circle cx="100" cy="23" r="6"/><circle cx="135" cy="23" r="6"/>
    <circle cx="200" cy="23" r="6" fill="#F07820"/><circle cx="265" cy="23" r="6"/>
    <circle cx="300" cy="23" r="6"/><circle cx="335" cy="23" r="6"/>
  </g>
  <!-- Crowd silhouettes -->
  <!-- Row 1 (back, smaller) -->
  <g fill="#1E2530" opacity="0.7">
    <ellipse cx="45" cy="158" rx="12" ry="16"/><rect x="33" y="155" width="24" height="22" rx="2"/>
    <ellipse cx="85" cy="155" rx="12" ry="16"/><rect x="73" y="152" width="24" height="25" rx="2"/>
    <ellipse cx="125" cy="160" rx="12" ry="15"/><rect x="113" y="157" width="24" height="20" rx="2"/>
    <ellipse cx="165" cy="156" rx="12" ry="16"/><rect x="153" y="153" width="24" height="24" rx="2"/>
    <ellipse cx="205" cy="159" rx="12" ry="15"/><rect x="193" y="156" width="24" height="21" rx="2"/>
    <ellipse cx="245" cy="155" rx="12" ry="16"/><rect x="233" y="152" width="24" height="25" rx="2"/>
    <ellipse cx="285" cy="158" rx="12" ry="16"/><rect x="273" y="155" width="24" height="22" rx="2"/>
    <ellipse cx="325" cy="156" rx="12" ry="16"/><rect x="313" y="153" width="24" height="24" rx="2"/>
    <ellipse cx="365" cy="160" rx="12" ry="15"/><rect x="353" y="157" width="24" height="20" rx="2"/>
  </g>
  <!-- Security barrier -->
  <rect x="10" y="170" width="380" height="5" rx="2" fill="#2B3340" stroke="#E05A1A" stroke-width="0.5"/>
  <!-- Barrier posts -->
  <g fill="#1E2530" stroke="#2B3340" stroke-width="1">
    <rect x="30" y="160" width="8" height="18" rx="1"/><rect x="90" y="160" width="8" height="18" rx="1"/>
    <rect x="150" y="160" width="8" height="18" rx="1"/><rect x="210" y="160" width="8" height="18" rx="1"/>
    <rect x="270" y="160" width="8" height="18" rx="1"/><rect x="330" y="160" width="8" height="18" rx="1"/>
    <rect x="360" y="160" width="8" height="18" rx="1"/>
  </g>
  <!-- Security guard at barrier (more prominent) -->
  <circle cx="200" cy="138" r="11" fill="#141B26" stroke="#E05A1A" stroke-width="1.5"/>
  <path d="M182,160 L182,145 C182,138 192,135 200,135 C208,135 218,138 218,145 L218,160" fill="#141B26" stroke="#E05A1A" stroke-width="1.5"/>
  <!-- Guard badge -->
  <path d="M196,142 L200,140 L204,142 L204,148 L200,151 L196,148 Z" fill="#E05A1A"/>
  <!-- Guard radio -->
  <rect x="218" y="142" width="6" height="10" rx="1" fill="#2B3340" stroke="#E05A1A" stroke-width="0.5"/>
  <!-- EVENT SECURITY badge -->
  <rect x="152" y="190" width="96" height="18" rx="3" fill="#E05A1A" opacity="0.9"/>
  <text x="200" y="203" font-family="monospace" font-size="9" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1">EVENT SECURITY</text>
</svg>
